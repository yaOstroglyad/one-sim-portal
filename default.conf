# Upstream для main API с sticky sessions
upstream main_backend {
    hash $cookie_jsessionid consistent;  # Хэш по cookie сессии
    server ${MAIN_BACKEND_SERVER};
    keepalive 32;
}

# Upstream для API Product с sticky sessions  
upstream api_product_backend {
    hash $cookie_jsessionid consistent;  # Хэш по cookie сессии
    server ${API_PRODUCT_SERVER};
    keepalive 32;
}

server {
    listen      80;
    listen  [::]:80;
    server_name  localhost;

    root   /var/www/html/one-sim-portal/;
    index  index.html index.htm;
    
    # API Product service с sticky sessions
    location /api-product/ {
        proxy_pass https://api_product_backend/;
        proxy_set_header Host ${API_PRODUCT_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передача всех заголовков и cookies
        proxy_pass_request_headers on;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        
        # Connection pooling
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Main API calls с sticky sessions
    location ~ ^/api/(.*)$ {
        proxy_pass https://main_backend/$1$is_args$args;
        proxy_set_header Host ${MAIN_BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передача всех заголовков и cookies
        proxy_pass_request_headers on;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        
        # Connection pooling
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Auth calls с sticky sessions
    location ~ ^/auth/(.*)$ {
        proxy_pass https://main_backend/auth/$1$is_args$args;
        proxy_set_header Host ${MAIN_BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передача всех заголовков и cookies
        proxy_pass_request_headers on;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        
        # Connection pooling
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Static files and SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
