name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release"]
  push:
    branches: ["main", "release"]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/quantum-soft-dev/esim-portal-ui
  NODE_VERSION: '22'

jobs:
  # ==================== VERSION (only on PR merge to release) ====================
  version:
    # Only bump version when PR is merged (not on direct push)
    # Detects: "Merge pull request #X" or "feat: something (#123)"
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release' &&
      (
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        contains(github.event.head_commit.message, '(#')
      )
    uses: ./.github/workflows/_version.yml
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ==================== INSTALL ====================
  install:
    needs: [version]
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    uses: ./.github/workflows/_install.yml
    with:
      pull-latest: ${{ needs.version.result == 'success' }}

  # ==================== TEST ====================
  test:
    needs: [install]
    if: always() && needs.install.result == 'success'
    uses: ./.github/workflows/_test.yml
    with:
      cache-key: ${{ needs.install.outputs.cache-key }}

  # ==================== BUILD ====================
  build:
    needs: [install]
    if: always() && needs.install.result == 'success'
    uses: ./.github/workflows/_build.yml
    with:
      cache-key: ${{ needs.install.outputs.cache-key }}

  # ==================== DOCKER (only on push, not PRs) ====================
  docker:
    needs: [install, test, build]
    if: |
      github.event_name == 'push' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/_docker.yml
    with:
      version: ${{ needs.install.outputs.version }}
      image-name: ghcr.io/quantum-soft-dev/esim-portal-ui
      push-latest: ${{ github.ref == 'refs/heads/release' }}

  # ==================== DEPLOY (only on push, not PRs) ====================
  deploy-test:
    needs: [install, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      version: ${{ needs.install.outputs.version }}
      image-name: ghcr.io/quantum-soft-dev/esim-portal-ui
      environment: test
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-release:
    needs: [install, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    uses: ./.github/workflows/_deploy.yml
    with:
      version: ${{ needs.install.outputs.version }}
      image-name: ghcr.io/quantum-soft-dev/esim-portal-ui
      environment: release
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
