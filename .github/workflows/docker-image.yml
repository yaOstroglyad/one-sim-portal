name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release"]
  push:
    branches: ["main", "release"]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/quantum-soft-dev/esim-portal-ui
  NODE_VERSION: '22'

jobs:
  # ==================== INSTALL ====================
  install:
    uses: ./.github/workflows/_install.yml

  # ==================== TEST ====================
  test:
    needs: [install]
    uses: ./.github/workflows/_test.yml
    with:
      cache-key: ${{ needs.install.outputs.cache-key }}

  # ==================== BUILD ====================
  build:
    needs: [install]
    uses: ./.github/workflows/_build.yml
    with:
      cache-key: ${{ needs.install.outputs.cache-key }}

  # ==================== VERSION (only after successful test/build on PR merge) ====================
  version:
    needs: [install, test, build]
    # Only bump version when:
    # 1. test and build succeeded
    # 2. PR is merged to release (not direct push)
    if: |
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release' &&
      (
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        contains(github.event.head_commit.message, '(#')
      )
    uses: ./.github/workflows/_version.yml
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ==================== DOCKER (only on push, after test/build succeed) ====================
  docker:
    needs: [install, test, build, version]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      github.event_name == 'push'
    uses: ./.github/workflows/_docker.yml
    with:
      # Use bumped version if available, otherwise current version
      version: ${{ needs.version.outputs.version || needs.install.outputs.version }}
      image-name: ghcr.io/quantum-soft-dev/esim-portal-ui
      push-latest: ${{ github.ref == 'refs/heads/release' }}

  # ==================== DEPLOY ====================
  deploy-test:
    needs: [install, version, docker]
    if: |
      always() &&
      needs.docker.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      version: ${{ needs.version.outputs.version || needs.install.outputs.version }}
      image-name: ghcr.io/quantum-soft-dev/esim-portal-ui
      environment: test
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-release:
    needs: [install, version, docker]
    if: |
      always() &&
      needs.docker.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release'
    uses: ./.github/workflows/_deploy.yml
    with:
      version: ${{ needs.version.outputs.version || needs.install.outputs.version }}
      image-name: ghcr.io/quantum-soft-dev/esim-portal-ui
      environment: release
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
