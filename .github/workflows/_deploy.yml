name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      version:
        description: "Version to deploy"
        type: string
        required: true
      image-name:
        description: "Docker image name"
        type: string
        required: true
      environment:
        description: "Deployment environment (test/release)"
        type: string
        required: true
      eks-region:
        description: "AWS EKS region"
        type: string
        default: "eu-central-1"
      eks-cluster:
        description: "AWS EKS cluster name"
        type: string
        default: "esim-dev"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.eks-region }}

      - name: Update kubeconfig
        run: |
          aws eks --region "${{ inputs.eks-region }}" update-kubeconfig --name "${{ inputs.eks-cluster }}"

      - name: Deploy to TEST
        if: inputs.environment == 'test'
        run: |
          echo "🚀 Deploying to TEST (v${{ inputs.version }})..."
          kubectl set image deployment/test-esim-portal test-esim-portal=${{ inputs.image-name }}:${{ inputs.version }}
          kubectl rollout status deployment/test-esim-portal --timeout=5m

      - name: Deploy to RELEASE
        if: inputs.environment == 'release'
        run: |
          echo "🚀 Deploying to RELEASE (v${{ inputs.version }})..."
          kubectl set image deployment/esim-portal esim-portal=${{ inputs.image-name }}:${{ inputs.version }}
          kubectl rollout status deployment/esim-portal --timeout=5m
