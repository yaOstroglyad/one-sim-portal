<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="botFaceMask-assistant">
      <!-- White = visible, Black = transparent cutout -->
      <rect width="32" height="32" fill="white"/>
      <!-- Cut out eyes -->
      <circle cx="13" cy="19" r="2" fill="black"/>
      <circle cx="19" cy="19" r="2" fill="black"/>
      <!-- Cut out smile -->
      <path d="M 12 24 Q 16 26 20 24" stroke="black" stroke-width="2" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>

  <!-- Antenna -->
  <circle cx="16" cy="7" r="2.5" fill="currentColor"/>

  <!-- Bot head with face cutouts -->
  <rect x="7" y="12" width="18" height="16" rx="4" fill="currentColor" mask="url(#botFaceMask-assistant)"/>
</svg>
