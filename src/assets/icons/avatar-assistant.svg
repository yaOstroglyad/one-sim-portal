<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Telegram-style bot avatar - filled with cutouts -->
  <defs>
    <mask id="botFaceMask">
      <!-- White = visible, Black = cutout -->
      <rect width="32" height="32" fill="white"/>
      <!-- Cut out eyes (centered) -->
      <circle cx="13" cy="16" r="1.4" fill="black"/>
      <circle cx="19" cy="16" r="1.4" fill="black"/>
      <!-- Cut out smile (centered) -->
      <path d="M 12 19.5 Q 16 21 20 19.5" stroke="black" stroke-width="2" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Bot head filled with mask (larger) -->
  <rect x="8" y="11" width="16" height="13" rx="3" fill="currentColor" mask="url(#botFaceMask)"/>

  <!-- Antenna -->
  <circle cx="16" cy="8" r="1.2" fill="currentColor"/>
  <line x1="16" y1="9.2" x2="16" y2="11" stroke="currentColor" stroke-width="1.8"/>
</svg>
