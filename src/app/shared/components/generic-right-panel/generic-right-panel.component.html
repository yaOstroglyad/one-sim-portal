<!-- Panel Backdrop -->
@if (isOpen && showOverlay) {
  <div class="panel-backdrop" (click)="onOverlayClick($event)"></div>
}

<!-- Right Panel -->
<div
  #panel
  class="right-panel"
  [class.open]="isOpen"
  [class.resizing]="isResizing"
  [class.expanded]="isExpanded"
  [ngClass]="panelClasses()"
  [style.top.px]="topOffset"
  [style.height]="'calc(100% - ' + topOffset + 'px)'"
  (click)="$event.stopPropagation()">

  <!-- Resize Handle -->
  @if (resizable) {
    <div
      #resizeHandle
      class="resize-handle"
      (mousedown)="onResizeStart($event)"
      title="Drag to resize">
      <div class="resize-grip">
        <div class="grip-line"></div>
        <div class="grip-line"></div>
        <div class="grip-line"></div>
        <div class="grip-line"></div>
        <div class="grip-line"></div>
      </div>
    </div>
  }

  <!-- Panel Header -->
  <div class="panel-header">
    <div class="header-content">
      @if (title) {
        <h2 class="panel-title">{{ title }}</h2>
      }
      @if (subtitle) {
        <p class="panel-subtitle">{{ subtitle }}</p>
      }
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      @for (action of allActions; track action.id) {
        <button
          type="button"
          class="action-btn"
          [class.disabled]="action.disabled"
          [title]="action.label"
          [disabled]="action.disabled"
          (click)="action.handler()">
          <svg cIcon [name]="action.icon" width="16" height="16"></svg>
        </button>
      }
    </div>
  </div>

  <!-- Panel Content -->
  <div class="panel-content">
    <ng-content select="[panel-content]"></ng-content>
  </div>

  <!-- Panel Footer -->
  @if (hasFooter) {
    <div class="panel-footer">
      <ng-content select="[panel-actions]"></ng-content>
    </div>
  }

</div>
