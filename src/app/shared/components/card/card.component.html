<div [class]="cardClasses.join(' ')">
  <!-- Header Section -->
  @if (shouldShowHeader) {
    <div class="os-card__header">
      <div class="os-card__header-content">
        @if (title) {
          <h3 class="os-card__title" [attr.title]="null">{{ title }}</h3>
        }
        @if (subtitle) {
          <p class="os-card__subtitle" [attr.title]="null">{{ subtitle }}</p>
        }
      </div>
      @if (showActions) {
        <div class="os-card__header-actions">
          <ng-content select="[slot=header-actions]"></ng-content>
        </div>
      }
    </div>
  }

  <!-- Content Section -->
  <div class="os-card__content">
    <ng-content></ng-content>
  </div>

  <!-- Actions Section -->
  @if (showActions) {
    <div class="os-card__actions">
      <ng-content select="[slot=actions]"></ng-content>
    </div>
  }
</div>
