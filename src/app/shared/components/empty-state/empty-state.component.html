<div class="empty-state">
  @if (imageSrc) {
    <img [src]="imageSrc" alt="Empty State" class="empty-state-image"/>
  }
  <h3 class="empty-state-title">{{ title }}</h3>
  @if (message) {
    <p class="empty-state-message">{{ message }}</p>
  }
  @if (hasAction) {
    <div class="action-container">
      <ng-content></ng-content>
    </div>
  }
</div>
