<div class="os-bar-chart"
     [style.width]="width()">
  @if (showLegend() && legendItems().length > 0) {
    <app-chart-legend
      [items]="displayLegendItems()"
      [maxHeight]="legendMaxHeight()"
      [topN]="defaultTopN()"
      [showControls]="showLegendControls()"
      (itemClick)="onLegendItemClick($event)"
      (showAll)="onShowAll()"
      (hideAll)="onHideAll()"
      (showTopN)="onShowTopN()">
    </app-chart-legend>
  }
  <div class="os-bar-chart__container" [style.height]="height()">
    <canvas #barChartCanvas
            class="os-bar-chart__canvas"
            [attr.aria-label]="'chart.barChart' | translate"
            role="img">
      <p class="os-bar-chart__fallback">
        {{ 'chart.noDataAvailable' | translate }}
      </p>
    </canvas>
  </div>
</div>
