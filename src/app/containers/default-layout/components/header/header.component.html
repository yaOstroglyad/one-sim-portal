<header
  class="header"
  [ngClass]="headerClasses()">

  <div class="header__container">
    <!-- Left side: Dropdown menu button and mobile toggle -->
    <div class="header__left">
      <!-- Dropdown menu button (disabled for now) -->
      <button
        class="header__dropdown-btn"
        disabled
        [attr.aria-label]="'Sections menu (coming soon)'">
        <svg cIcon name="cil-hamburger-menu" width="24" height="24"></svg>
      </button>

      <!-- Mobile menu toggle -->
      <button
        class="header__mobile-toggle"
        (click)="toggleMobileSidebar()"
        [attr.aria-label]="'Toggle mobile menu'">
        <svg cIcon name="cil-menu" width="24" height="24"></svg>
      </button>
    </div>

    <!-- Center: Search bar -->
    <div class="header__center">
      <div class="header__search">
        <svg cIcon name="cil-search" class="header__search-icon" width="20" height="20"></svg>
        <input
          type="text"
          class="header__search-input"
          placeholder="Search..."
          [attr.aria-label]="'Search'">
      </div>
    </div>

    <!-- Right side: User actions -->
    <div class="header__right">
      <!-- Theme toggle -->
      <button
        class="header__action-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="isDarkTheme()">
        @if (isDarkTheme()) {
          <svg cIcon name="cil-sun" width="18" height="18"></svg>
        } @else {
          <svg cIcon name="cil-moon" width="18" height="18"></svg>
        }
      </button>

      <!-- User menu with os-menu -->
      <os-menu
        [isOpen]="isUserDropdownOpen()"
        [sections]="userMenuSections()"
        position="bottom-right"
        (closed)="closeUserMenu()">
        <app-user-avatar
          menuTrigger
          [src]="userAvatar()"
          [alt]="userName()"
          [ariaLabel]="'User menu'"
          [initials]="userInitials()"
          size="md"
          variant="circle"
          (click)="toggleUserMenu(); $event.stopPropagation()">
        </app-user-avatar>
      </os-menu>
    </div>
  </div>
</header>
