<header
  class="header"
  [ngClass]="headerClasses()">

  <div class="header__container">
    <!-- Left side: Mobile toggle and breadcrumb -->
    <div class="header__left">
      <!-- Mobile menu toggle -->
      <button
        class="header__mobile-toggle"
        (click)="toggleMobileSidebar()"
        [attr.aria-label]="'Toggle mobile menu'">
        <svg cIcon name="cil-menu" width="24" height="24"></svg>
      </button>

      <!-- Breadcrumb -->
      <div class="header__breadcrumb">
        <app-breadcrumb></app-breadcrumb>
      </div>
    </div>

    <!-- Right side: User actions -->
    <div class="header__right">
      <!-- User menu with os-menu -->
      <os-menu
        [isOpen]="isUserDropdownOpen()"
        [sections]="userMenuSections()"
        position="bottom-right"
        (closed)="closeUserMenu()">
        <app-user-avatar
          menuTrigger
          [src]="userAvatar()"
          [alt]="userName()"
          [ariaLabel]="'User menu'"
          [initials]="userInitials()"
          size="md"
          variant="circle"
          (click)="toggleUserMenu(); $event.stopPropagation()">
        </app-user-avatar>
      </os-menu>
    </div>
  </div>
</header>
