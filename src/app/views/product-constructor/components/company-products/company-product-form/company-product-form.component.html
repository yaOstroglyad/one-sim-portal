<div class="company-product-form-container">
  <!-- Error Display -->
  <div *ngIf="error" class="error-alert">
    <svg cIcon name="cil-warning" width="20" height="20"></svg>
    <span>{{ error }}</span>
  </div>

  <!-- Form Content -->
  <app-form-generator 
    [config]="formConfig" 
    (formChanges)="onFormChanges($event)">
  </app-form-generator>

  <!-- Create Mode: Show Selected Tariff Offer Details -->
  @if (!isEditing && selectedTariffOffer) {
    <app-selected-tariff-offer-details
      [tariffOffer]="selectedTariffOffer"
      [modifiedRetailPrice]="modifiedRetailPrice"
      [showTitle]="true"
      [infoMessage]="infoMessage"
      [editable]="true"
      (modifyPrice)="onModifyTariffOfferPrice($event)">
    </app-selected-tariff-offer-details>
  }

  <!-- Edit Mode: Show Product Prices Table -->
  @if (isEditing) {
    <app-company-product-prices-table
      [prices]="prices()"
      [loading]="pricesLoading()"
      [editable]="true"
      (editPrice)="onEditPrice($event)"
      (addPrice)="onAddPrice()">
    </app-company-product-prices-table>
  }
</div>
