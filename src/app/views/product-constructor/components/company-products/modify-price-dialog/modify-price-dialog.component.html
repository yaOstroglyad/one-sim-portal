<h2 mat-dialog-title class="dialog-header">{{ dialogTitle }}</h2>

<mat-dialog-content class="mat-typography dialog-content">
  <!-- Loading State -->
  @if (loading()) {
    <app-loader></app-loader>
  }

  <!-- Price Information & Preview (only when viewModel is available) -->
  @if (viewModel !== null) {
    @let vmValue = viewModel();

    <!-- Price Info Display Component -->
    @if (vmValue.priceInfo) {
      <app-price-info-display
        [priceInfo]="vmValue.priceInfo"
        [basePriceLabel]="uiConfig.texts.labels.basePrice"
        [currentPriceLabel]="uiConfig.showCurrentTariffInfo ? uiConfig.texts.labels.customerPrice : uiConfig.texts.labels.currentPrice"
        [serviceProviderName]="vmValue.serviceProviderName"
        [showServiceProvider]="vmValue.showServiceProvider && uiConfig.showCurrentTariffInfo"
        [showBasePriceIfDifferent]="true">
      </app-price-info-display>
    }

    <!-- Price Preview Component -->
    @if (vmValue.pricePreview) {
      <app-price-preview [preview]="vmValue.pricePreview"></app-price-preview>
    }
  }

  <!-- Form Section -->
  <div class="modify-form">
    <h6>{{ uiConfig.texts.labels.newPrice }}:</h6>

    <app-form-generator
      [config]="formConfig"
      (formChanges)="onFormChanges($event)">
    </app-form-generator>
  </div>

  <!-- Error Message -->
  @if (error()) {
    <app-info-strip
      type="alert"
      icon="error"
      [text]="error()!">
    </app-info-strip>
  }

  <!-- Info Message -->
  <app-info-strip
    type="primary"
    icon="info"
    [text]="infoMessage">
  </app-info-strip>
</mat-dialog-content>

<mat-dialog-actions class="dialog-footer" align="end">
  <button
    cButton
    color="secondary"
    variant="outline"
    (click)="onCancel()"
    [disabled]="loading()">
    Cancel
  </button>

  <button
    cButton
    color="primary"
    (click)="onSave()"
    [disabled]="!modifyForm?.valid || loading()">
    @if (loading()) {
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      <span>Saving...</span>
    } @else {
      <span>{{ saveButtonText }}</span>
    }
  </button>
</mat-dialog-actions>
