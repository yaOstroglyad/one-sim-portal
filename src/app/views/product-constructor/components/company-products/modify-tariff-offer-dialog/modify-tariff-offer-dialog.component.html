<h2 mat-dialog-title class="dialog-header">Modify Tariff Offer Price</h2>

<mat-dialog-content class="mat-typography dialog-content">
  <!-- Price Information & Preview -->
  @if (tariffOffer()) {
    <!-- Price Info Display Component -->
    <app-price-info-display
      [priceInfo]="priceInfo()"
      [serviceProviderName]="serviceProviderName()"
      [showServiceProvider]="true"
      [currentPriceLabel]="'Current Tariff Offer Price'">
    </app-price-info-display>

    <!-- Price Preview Component -->
    <app-price-preview [preview]="pricePreview()"></app-price-preview>
  }

  <!-- Form Section -->
  <div class="modify-form">
    <h6>New Price Settings:</h6>

    <app-form-generator
      [config]="formConfig"
      (formChanges)="onFormChanges($event)">
    </app-form-generator>
  </div>

  <!-- Info Message -->
  <app-info-strip
    type="primary"
    icon="info"
    text="This will create a new tariff offer with the updated price and currency.">
  </app-info-strip>
</mat-dialog-content>

<mat-dialog-actions class="dialog-footer" align="end">
  <button
    cButton
    color="secondary"
    variant="outline"
    (click)="onCancel()">
    Cancel
  </button>

  <button
    cButton
    color="primary"
    (click)="onSave()"
    [disabled]="!isFormValid()">
    Save
  </button>
</mat-dialog-actions>
