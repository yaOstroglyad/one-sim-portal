<div class="os-login-container">
    <div class="os-login-content">
        <div class="os-login-logo-container">
            <img src="assets/img/brand/1esim-logo.png" alt="One eSIM" class="os-login-logo">
        </div>
        <h1 class="os-login-title">Log in</h1>
        <form class="os-login-form" [formGroup]="form" (ngSubmit)="login()">
            <div class="os-login-form-field">
                <input
                    id="loginName"
                    formControlName="loginName"
                    type="text"
                    class="os-login-form-input"
                    placeholder="{{ 'login.userNamePlaceholder' | translate }}">
            </div>
            <div class="os-login-form-field">
                <input
                    id="password"
                    formControlName="password"
                    type="password"
                    class="os-login-form-input"
                    placeholder="{{ 'login.passwordPlaceholder' | translate }}">
            </div>
            <button type="submit" class="os-login-button">
                {{ 'login.loginButton' | translate }}
            </button>
        </form>
        <div class="os-login-tagline os-login-mobile-only">
            Enabling new revenue and connectivity solutions for travel & tech players
        </div>
    </div>
    <div class="os-login-background-waves" aria-hidden="true"></div>
</div>
