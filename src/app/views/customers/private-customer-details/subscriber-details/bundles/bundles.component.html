@if (bundlesView$ | async; as usages) {
  <div class="content-b">
    @if (!usages || usages.length === 0) {
      <app-empty-state
        [title]="'bundles.noBundlesFound' | translate"
        [imageSrc]="'assets/img/empty-states/no-products.svg'">
      </app-empty-state>
    }
    @if (usages.length > 0) {
      <div #scrollContainer
        [ngClass]="usages.length == 1 ? 'center' : null"
        class="scroll-container">
        @for (usage of usages; track usage) {
          <div class="bundle-item">
            <app-chart [chartData]="usage"></app-chart>
          </div>
        }
      </div>
    }
    @if (usages.length > 2) {
      <div class="navigation-buttons">
        <button class="nav-button" (click)="scrollLeft()">&#10094;</button>
        <button class="nav-button" (click)="scrollRight()">&#10095;</button>
      </div>
    }
  </div>
}
