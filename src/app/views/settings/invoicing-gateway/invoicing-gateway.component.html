<div class="container">
    <!-- Account selector for admins only -->
    <app-account-selector
        *ngIf="isAdmin"
        [helperText]="'COMMON.select_account_hint_message'"
        (accountSelected)="onAccountSelected($event)">
    </app-account-selector>

    <!-- Admin warning for admin accounts -->
    <div *ngIf="isAdmin && selectedAccount?.isAdmin" class="admin-account-message mx-3">
        <mat-icon color="warn">warning</mat-icon>
        <span>{{ 'invoicingGateway.adminAccountWarning' | translate }}</span>
    </div>

    <!-- Main content - shown for non-admins always, for admins only when non-admin account selected -->
    <ng-container *ngIf="shouldShowContent">
        <div class="d-flex justify-content-between align-items-center mb-3 mx-3">
            <mat-hint class="hint mb-1">
                <mat-icon fontIcon="info_outline"></mat-icon>
                {{ 'invoicingGateway.hint' | translate }}
            </mat-hint>

            <ng-container *ngIf="strategyTypes$ | async as strategies">
                <div *ngIf="strategies && strategies.length > 0">
                    <c-dropdown>
                        <button cButton cDropdownToggle color="secondary">
                            {{ 'invoicingGateway.setupNew' | translate }}
                        </button>
                        <ul cDropdownMenu>
                            <li *ngFor="let strategy of strategies">
                                <a cDropdownItem (click)="openPanel({ name: strategy }, 'create')">{{ strategy }}</a>
                            </li>
                        </ul>
                    </c-dropdown>
                </div>
            </ng-container>
        </div>

        <generic-table [config$]="tableConfig$"
                       [menu]="menuTemplate"
                       [data$]="dataList$"></generic-table>
    </ng-container>
</div>

<!-- Shared templates -->
<ng-template #menuTemplate let-item>
    <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="edit(item)">{{ 'invoicingGateway.setup' | translate }}</button>
    </mat-menu>
</ng-template>

<ng-template #isActiveFlag let-data='context'>
    <td>
        <div class="badge-display">
            <c-badge [class]="data?.isActive ? 'active-badge' : 'disabled-badge'"
                     class="me-1"
                     shape="rounded-pill">{{ data?.isActive }}
            </c-badge>
        </div>
    </td>
</ng-template>

<!-- Right Panel for Create/Edit Invoicing Method -->
<app-generic-right-panel
    [isOpen]="isPanelOpen"
    [title]="panelTitle | translate"
    [subtitle]="selectedInvoice?.name"
    [hasFooter]="true"
    [defaultWidth]="650"
    [minWidth]="500"
    [maxWidth]="900"
    (close)="onPanelClose()">
    
    <div panel-content *ngIf="selectedInvoice">
        <app-edit-invoices
            #invoiceFormRef
            [invoicingMethod]="selectedInvoice"
            [accountId]="selectedAccount?.id"
            (save)="onInvoiceSaved()"
            (cancel)="onPanelClose()">
        </app-edit-invoices>
    </div>

    <ng-container panel-actions>
        <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="onPanelClose()">
            {{ 'common.cancel' | translate }}
        </button>
        <button
            *ngIf="selectedInvoice?.id"
            type="button"
            class="btn"
            [ngClass]="selectedInvoice?.isActive ? 'btn-warning' : 'btn-success'"
            (click)="onToggleStatus()">
            {{ selectedInvoice?.isActive ? ('editInvoicingGateway.deactivate' | translate) : ('editInvoicingGateway.activate' | translate) }}
        </button>
        <button
            type="button"
            class="btn btn-primary"
            (click)="invoiceFormRef?.onSubmit()"
            [disabled]="invoiceFormRef?.loading || !invoiceFormRef?.invoiceForm?.valid">
            <span *ngIf="invoiceFormRef?.loading" class="loading-spinner"></span>
            {{ panelMode === 'create' ? ('editInvoicingGateway.create' | translate) : ('editInvoicingGateway.save' | translate) }}
        </button>
    </ng-container>
</app-generic-right-panel>
