<div class="payment-gateway-form">
  @if (loading) {
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <span>Loading form fields...</span>
    </div>
  }

  @if (formConfig && !loading) {
    <app-form-generator
      [config]="formConfig"
      (formChanges)="onFormChanges($event)">
    </app-form-generator>
  }

  @if (!formConfig && !loading) {
    <div class="no-fields-message">
      No form fields available for this strategy.
    </div>
  }
</div>
